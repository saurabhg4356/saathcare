services:
  mongodb:
    image: mongo:7.0
    container_name: saathcare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=saathcare
    volumes:
      - mongo_data:/data/db
    networks:
      - saathcare-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: saathcare-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/saathcare}
      - JWT_ACCESS_SECRET=saathcare_docker_dev_access_secret_key_32chars_long
      - JWT_REFRESH_SECRET=saathcare_docker_dev_refresh_secret_key_32chars_long
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY_DAYS=7
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      - MISSED_TASK_CRON_SCHEDULE=*/5 * * * *
      - MISSED_TASK_JOB_ENABLED=true
      - EMAIL_PROVIDER=mock
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=uploads
    volumes:
      - receipts_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - saathcare-network

  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: saathcare-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - saathcare-network

volumes:
  mongo_data:
    driver: local
  receipts_data:
    driver: local

networks:
  saathcare-network:
    driver: bridge
